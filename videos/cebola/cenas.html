<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="times.js"></script>
<script>
const W=1080,H=1920,F='"Inter Display","Inter",sans-serif';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eoc=x=>1-Math.pow(1-clamp(x),3);
const prog=(lt,a,b)=>clamp((lt-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* ---------- textos ---------- */
function headline(parts,y,size,lt,at=.08){
  const p=prog(lt,at,at+.35);if(p<=0)return;
  ctx.save();ctx.globalAlpha*=clamp(p*3);
  ctx.translate(540,y);const sc=.6+.4*eob(p);ctx.scale(sc,sc);
  ctx.font=`900 ${size}px ${F}`;ctx.textBaseline='middle';
  const ws=parts.map(([tx])=>ctx.measureText(tx).width);
  const tot=ws.reduce((a,b)=>a+b,0);if(tot>940){const f=940/tot;ctx.scale(f,f)}
  let x=-tot/2;
  parts.forEach(([tx,col],i)=>{
    ctx.lineJoin='round';ctx.lineWidth=size*.16;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(tx,x,0);
    ctx.fillStyle=col;ctx.shadowColor=col==='#fff'?'rgba(0,0,0,0)':col;ctx.shadowBlur=col==='#fff'?0:30;ctx.fillText(tx,x,0);ctx.shadowBlur=0;
    x+=ws[i];
  });
  ctx.restore();
}
function label(tx,x,y,size,col='#fff',alpha=1,weight=800){
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px ${F}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=size*.18;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(tx,x,y);
  ctx.fillStyle=col;ctx.fillText(tx,x,y);ctx.restore();
}
function subtitle(text,hl,lt){
  const p=prog(lt,0,.15);
  ctx.save();ctx.font=`900 64px ${F}`;ctx.textBaseline='middle';
  const words=text.split(' '),lines=[[]];let w=0;
  const sp=ctx.measureText(' ').width;
  for(const wd of words){const ww=ctx.measureText(wd).width;
    if(w+ww>900&&lines[lines.length-1].length){lines.push([]);w=0}
    lines[lines.length-1].push(wd);w+=ww+sp}
  const lh=84, y0=1630-(lines.length-1)*lh;
  ctx.translate(540,y0);ctx.scale(.9+.1*eoc(p),.9+.1*eoc(p));ctx.globalAlpha*=clamp(p*2);
  lines.forEach((ln,li)=>{
    const tw=ln.reduce((a,wd)=>a+ctx.measureText(wd).width,0)+sp*(ln.length-1);
    let x=-tw/2;
    for(const wd of ln){
      const key=wd.toLowerCase().replace(/[^a-záàâãéêíóôõúç0-9]/g,'');
      ctx.lineJoin='round';ctx.lineWidth=14;ctx.strokeStyle='#000';ctx.strokeText(wd,x,li*lh);
      ctx.fillStyle=hl.includes(key)?'#ffd23f':'#fff';ctx.fillText(wd,x,li*lh);
      x+=ctx.measureText(wd).width+sp;
    }
  });
  ctx.restore();
}
function watermark(){ctx.save();ctx.globalAlpha=.6;ctx.font=`800 34px ${F}`;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('@factuva',540,150);ctx.restore()}
function flow(x1,y1,x2,y2,t,col,n=6,r=9){
  ctx.save();ctx.strokeStyle=col;ctx.globalAlpha*=.35;ctx.setLineDash([10,14]);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
  for(let i=0;i<n;i++){const q=((t*.8+i/n)%1);ctx.save();ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(lerp(x1,x2,q),lerp(y1,y2,q),r,0,7);ctx.fill();ctx.restore()}
}



/* ---------- fundo ---------- */
function background(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1638');g.addColorStop(.55,'#1e1029');g.addColorStop(1,'#0d0812');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const l=ctx.createRadialGradient(540,880,60,540,880,900);l.addColorStop(0,'rgba(200,150,255,.18)');l.addColorStop(1,'rgba(200,150,255,0)');ctx.fillStyle=l;ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){const x=rnd(i+3)*W,y=((rnd(i+5)*H-t*(.2+rnd(i)*.6)*25)%H+H)%H;ctx.fillStyle=`rgba(230,200,255,${.06+rnd(i+7)*.16})`;ctx.beginPath();ctx.arc(x,y,2+rnd(i+9)*5,0,7);ctx.fill()}
}
/* ---------- objetos ---------- */
function onion(x,y,s,t,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(o.rot||0);
  const body=()=>{ctx.beginPath();ctx.moveTo(0,-230);ctx.bezierCurveTo(60,-150,200,-110,200,20);ctx.bezierCurveTo(200,150,100,200,0,200);ctx.bezierCurveTo(-100,200,-200,150,-200,20);ctx.bezierCurveTo(-200,-110,-60,-150,0,-230);ctx.closePath()};
  ctx.strokeStyle='#d9c3a5';ctx.lineWidth=5;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*14,195);ctx.quadraticCurveTo(i*28,240,i*20,265);ctx.stroke()}
  ctx.strokeStyle='#7dbb5c';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-225);ctx.quadraticCurveTo(10+Math.sin(t*2)*8,-300,-10,-350);ctx.stroke();
  const g=ctx.createRadialGradient(-60,-40,20,0,20,240);g.addColorStop(0,'#d17ac9');g.addColorStop(.6,'#9b3f8f');g.addColorStop(1,'#5e1f58');
  body();ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,220,250,.25)';ctx.lineWidth=5;for(const k of[-.6,-.25,.25,.6]){ctx.beginPath();ctx.moveTo(0,-220);ctx.bezierCurveTo(200*k,-120,240*k,120,0,198);ctx.stroke()}
  if(o.face){ctx.fillStyle='#1b1020';[-60,60].forEach(e=>{ctx.beginPath();ctx.arc(e,0,14,0,7);ctx.fill()});ctx.lineWidth=8;ctx.strokeStyle='#1b1020';ctx.beginPath();ctx.arc(0,40,40,o.face==='mad'?Math.PI*1.15:.2*Math.PI,o.face==='mad'?Math.PI*1.85:.8*Math.PI);ctx.stroke();
    if(o.face==='mad'){ctx.beginPath();ctx.moveTo(-90,-45);ctx.lineTo(-35,-25);ctx.moveTo(90,-45);ctx.lineTo(35,-25);ctx.stroke()}}
  ctx.restore();
}
function half(x,y,s,side){ // metade cortada, vista do corte
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#9b3f8f';ctx.beginPath();ctx.ellipse(0,0,200,215,0,0,7);ctx.fill();
  const cols=['#f3e6f3','#e6c8e8','#f7eef7','#dcb7df','#f3e6f3','#e9d3ea'];
  for(let i=0;i<6;i++){ctx.fillStyle=cols[i];ctx.beginPath();ctx.ellipse(0,10+i*4,185-i*30,200-i*33,0,0,7);ctx.fill()}
  ctx.restore();
}
function knife(x,y,ang,s=1,shine=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);
  ctx.fillStyle='#3b2a20';ctx.beginPath();ctx.roundRect(150,-26,190,52,18);ctx.fill();ctx.fillStyle='#c9a86a';[200,260,310].forEach(px=>{ctx.beginPath();ctx.arc(px,0,6,0,7);ctx.fill()});
  const g=ctx.createLinearGradient(0,-40,0,40);g.addColorStop(0,'#f2f5fa');g.addColorStop(1,'#9aa3b2');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(150,-34);ctx.lineTo(-260,-34);ctx.quadraticCurveTo(-300,-10,-270,30);ctx.lineTo(150,30);ctx.closePath();ctx.fill();
  if(shine>0){const sx=lerp(-250,140,shine);const sg=ctx.createLinearGradient(sx-40,0,sx+40,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.95)');sg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sg;ctx.fillRect(-300,-34,450,64)}
  ctx.restore();
}
function face(x,y,s,t,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#8fa2ff';ctx.beginPath();ctx.arc(0,0,230,0,7);ctx.fill();
  ctx.fillStyle='#fff';[-85,85].forEach(e=>{ctx.beginPath();ctx.ellipse(e,-30,48,o.squint?18:44,0,0,7);ctx.fill()});
  ctx.fillStyle='#1d2147';[-85,85].forEach(e=>{ctx.beginPath();ctx.arc(e,-28,o.squint?10:20,0,7);ctx.fill()});
  if(o.red){ctx.strokeStyle='rgba(255,60,80,.7)';ctx.lineWidth=4;[-85,85].forEach(e=>{for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(e-44+i*4,-30+i*6-10);ctx.lineTo(e-20,-30);ctx.stroke()}})}
  ctx.strokeStyle='#1d2147';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();
  if(o.happy)ctx.arc(0,70,70,.15*Math.PI,.85*Math.PI);else ctx.arc(0,130,60,1.2*Math.PI,1.8*Math.PI);ctx.stroke();
  if(o.tears){for(const e of[-85,85])for(let i=0;i<3;i++){const q=((t*.9+i/3+(e>0?.5:0))%1);ctx.fillStyle=`rgba(120,200,255,${1-q*.6})`;const ty=10+q*260,tx=e+(e>0?30:-30);ctx.beginPath();ctx.moveTo(tx,ty-26);ctx.quadraticCurveTo(tx+16,ty,tx,ty+12);ctx.quadraticCurveTo(tx-16,ty,tx,ty-26);ctx.fill()}}
  ctx.restore();
}
function bigEye(x,y,s,t,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#8fa2ff';ctx.beginPath();ctx.ellipse(0,0,300,190,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,230,o.squint?60:120,0,0,7);ctx.fill();
  if(o.red){ctx.save();ctx.beginPath();ctx.ellipse(0,0,230,o.squint?60:120,0,0,7);ctx.clip();ctx.strokeStyle=`rgba(255,50,70,${o.red})`;ctx.lineWidth=5;for(let i=0;i<10;i++){const a=rnd(i)*7;ctx.beginPath();ctx.moveTo(Math.cos(a)*230,Math.sin(a)*120);ctx.quadraticCurveTo(Math.cos(a)*150+20,Math.sin(a)*80,Math.cos(a)*90,Math.sin(a)*50);ctx.stroke()}ctx.restore()}
  ctx.fillStyle='#5a3d2b';ctx.beginPath();ctx.arc(0,0,o.squint?50:85,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,o.squint?24:40,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-25,-25,14,0,7);ctx.fill();
  ctx.strokeStyle='#1d2147';ctx.lineWidth=10;ctx.beginPath();ctx.ellipse(0,0,232,o.squint?62:122,0,Math.PI,0);ctx.stroke();
  if(o.tears){for(let i=0;i<5;i++){const q=((t*.8+i/5)%1);ctx.fillStyle=`rgba(120,200,255,${1-q*.5})`;const tx=160+i*8,ty=60+q*360;ctx.beginPath();ctx.moveTo(tx,ty-34);ctx.quadraticCurveTo(tx+22,ty,tx,ty+16);ctx.quadraticCurveTo(tx-22,ty,tx,ty-34);ctx.fill()}}
  ctx.restore();
}
function gas(x0,y0,x1,y1,t,n=7,p=1){
  for(let i=0;i<n;i++){const q=((t*.35+i/n)%1)*p;const x=lerp(x0,x1,q)+Math.sin(q*9+i)*40,y=lerp(y0,y1,q);
    ctx.save();ctx.globalAlpha*=.75*(1-q*.6);ctx.strokeStyle='#d8ff8a';ctx.lineWidth=12;ctx.lineCap='round';ctx.shadowColor='#d8ff8a';ctx.shadowBlur=20;
    ctx.beginPath();for(let k=0;k<8;k++){const kx=x+Math.sin(k*.9+t*3+i)*18,ky=y-k*16;k?ctx.lineTo(kx,ky):ctx.moveTo(kx,ky)}ctx.stroke();ctx.restore()}
}
function brain(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ff9ec4';ctx.beginPath();ctx.ellipse(-60,0,120,100,0,0,7);ctx.ellipse(60,0,120,100,0,0,7);ctx.fill();
  ctx.strokeStyle='#d0648f';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,-95);ctx.lineTo(0,95);ctx.stroke();for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(-120+i*48,-20+(i%2)*40,30,Math.PI*.2,Math.PI*1.2);ctx.stroke()}ctx.restore()}
function fridge(x,y,open,t){ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#e8eef7';ctx.beginPath();ctx.roundRect(-210,-380,420,760,40);ctx.fill();ctx.fillStyle='#bfd3ea';ctx.fillRect(-190,-120,380,8);
  ctx.fillStyle='rgba(150,210,255,.35)';ctx.fillRect(-180,-100,360,460);
  onion(0,190,.55,t);
  ctx.fillStyle='#9fb6d1';ctx.fillRect(-180,60,360,10);
  ctx.save();ctx.translate(-210,0);ctx.scale(Math.max(.05,1-open),1);ctx.fillStyle='#f6f9fd';ctx.beginPath();ctx.roundRect(0,-110,420,490,30);ctx.fill();ctx.fillStyle='#9fb6d1';ctx.fillRect(360,40,16,120);ctx.restore();
  ctx.restore();
  for(let i=0;i<8;i++){const q=((t*.4+i/8)%1);label('❄',x-260+rnd(i)*520,y-450+q*240,40,'#cfe8ff',.8*(1-q),900)}
}
function beetle(x,y,s,t,flip=1){ctx.save();ctx.translate(x,y);ctx.scale(s*flip,s);ctx.strokeStyle='#222';ctx.lineWidth=6;for(let i=-1;i<=1;i++){const w=Math.sin(t*14+i)*8;ctx.beginPath();ctx.moveTo(i*30,0);ctx.lineTo(i*34+w,40);ctx.moveTo(i*30,0);ctx.lineTo(i*34-w,-40);ctx.stroke()}
  ctx.fillStyle='#3d6b3a';ctx.beginPath();ctx.ellipse(0,0,70,45,0,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(75,0,28,0,7);ctx.fill();ctx.restore()}

/* ---------- cenas ---------- */
const FR=["Por que cortar cebola faz a gente chorar?","Não é tristeza. É uma arma química.","A cebola cresce debaixo da terra…","e precisa se defender de bichos que querem comê-la.","Quando você corta a cebola, rompe as células dela.","Duas substâncias que estavam separadas se misturam…","e formam um gás que flutua no ar.","Esse gás chega aos seus olhos…","e irrita os nervos de lá.","Seu cérebro manda os olhos produzirem lágrimas…","para lavar a irritação.","Quer chorar menos?","Coloque a cebola na geladeira antes de cortar.","E use uma faca bem afiada.","Menos células esmagadas, menos lágrimas."];
const HL=[['cebola','chorar'],['tristeza','arma','química'],['terra'],['defender','bichos'],['corta','células'],['substâncias','misturam'],['gás'],['gás','olhos'],['irrita','nervos'],['cérebro','lágrimas'],['lavar','irritação'],['chorar','menos'],['geladeira'],['faca','afiada'],['menos','lágrimas']];
const GREEN='#d8ff8a',PURP='#e29be0';
const D=[
 (lt,t)=>{face(540,860,1.05,t,{tears:true});onion(540,1230,.6,t);headline([['POR QUE ','#fff'],['CHORAMOS?',PURP]],400,110,lt,.05)},
 (lt,t,d)=>{if(lt<d*.42){label('😢',540,880,260,'#fff',eob(prog(lt,0,.3)),900);const p=eoc(prog(lt,.4,.7));ctx.save();ctx.strokeStyle='#ff4d6d';ctx.lineWidth=28;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(380,720);ctx.lineTo(380+320*p,720+320*p);ctx.moveTo(700,720);ctx.lineTo(700-320*p,720+320*p);ctx.stroke();ctx.restore();headline([['NÃO É ','#fff'],['TRISTEZA','#9fb6ff']],400,110,lt,.05)}
   else{const l=lt-d*.42;onion(540,920,1.1*eob(prog(l,0,.35)),t,{face:'mad'});label('⚠️',800,620,130,'#fff',prog(l,.3,.6),900);headline([['ARMA ','#fff'],['QUÍMICA',GREEN]],400,120,l,0)}},
 (lt,t)=>{ctx.fillStyle='#4a2f22';ctx.fillRect(0,760,W,700);ctx.fillStyle='#5d3b2a';for(let i=0;i<40;i++){ctx.beginPath();ctx.arc(rnd(i)*W,800+rnd(i+2)*640,6+rnd(i+4)*14,0,7);ctx.fill()}
   ctx.fillStyle='#4f9a45';for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,760);ctx.lineTo(x+12,700+Math.sin(t*2+x)*10);ctx.lineTo(x+24,760);ctx.fill()}
   onion(540,1080-eoc(prog(lt,0,1))*0,.9,t);headline([['DEBAIXO DA ','#fff'],['TERRA','#c9905f']],400,110,lt,.05)},
 (lt,t,d)=>{onion(620,980,.9,t,{face:lt>1.3?'mad':null});const p=prog(lt,0,1.3);
   if(lt<1.3)beetle(lerp(80,320,p),1150,1,t);else{const q=prog(lt,1.3,2.4);beetle(lerp(320,-120,q),1150-q*80,1,t,-1);gas(560,760,560,560,t,5,1)}
   headline([['AUTO','#fff'],['DEFESA',GREEN]],400,120,lt,.05)},
 (lt,t)=>{const p=eoc(prog(lt,.2,1.3));if(p<1){onion(540,960,1,t);knife(560,700+p*300,0,1)}
   else{const q=eoc(prog(lt,1.3,1.8));half(540-q*190,960,.82);half(540+q*190,960,.82);knife(700,1300,.1,.8)}
   for(let i=0;i<12;i++){const a=rnd(i)*7,r=lerp(80,320,prog(lt,1.3,2.5));if(lt>1.3){ctx.fillStyle=`rgba(230,200,255,${1-prog(lt,1.3,2.8)})`;ctx.beginPath();ctx.arc(540+Math.cos(a)*r,960+Math.sin(a)*r,10,0,7);ctx.fill()}}
   headline([['CÉLULAS ','#fff'],['ROMPIDAS',PURP]],400,110,lt,.05)},
 (lt,t)=>{const br=eoc(prog(lt,.9,1.6));ctx.save();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=10;ctx.beginPath();ctx.roundRect(160,640,760,560,40);ctx.stroke();
   if(br<1){ctx.beginPath();ctx.moveTo(540,640);ctx.lineTo(540,640+560*(1-br)/2);ctx.moveTo(540,1200);ctx.lineTo(540,1200-560*(1-br)/2);ctx.stroke()}ctx.restore();
   for(let i=0;i<18;i++){const side=i%2?1:-1;const hx=540+side*(90+rnd(i)*240),hy=700+rnd(i+5)*440;const mx=540+Math.sin(t*2+i)*260,my=920+Math.cos(t*2.3+i)*220;const x=lerp(hx,mx,br),y=lerp(hy,my,br);
     ctx.fillStyle=side>0?'#ffb04a':'#5ec8ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(x+Math.sin(t*4+i)*6,y,18,0,7);ctx.fill();ctx.shadowBlur=0}
   if(br>.6)for(let i=0;i<8;i++){const a=t*3+i;label('✨',540+Math.cos(a)*200,920+Math.sin(a)*180,50,'#fff',(br-.6)*2.5,900)}
   headline([['SE ','#fff'],['MISTURAM','#ffb04a']],400,120,lt,.05)},
 (lt,t)=>{half(400,1130,.6);half(680,1130,.6);gas(540,1000,540,560,t,8,eoc(prog(lt,0,.8)));label('gás',800,780,64,GREEN,prog(lt,.6,.9),900);headline([['VIRA ','#fff'],['GÁS',GREEN]],400,130,lt,.05)},
 (lt,t)=>{half(260,1180,.42);bigEye(700,840,.85,t,{});gas(260,1080,640,860,t,8,1);headline([['CHEGA NOS ','#fff'],['OLHOS','#9fd8ff']],400,110,lt,.05)},
 (lt,t)=>{bigEye(540,880,1.2,t,{squint:true,red:eoc(prog(lt,0,1))});for(let i=0;i<6;i++){const a=i/6*7+t;const f=(Math.sin(t*12+i*2)+1)/2;ctx.save();ctx.strokeStyle=`rgba(255,240,90,${.4+.6*f})`;ctx.lineWidth=8;ctx.beginPath();let x=540+Math.cos(a)*330,y=880+Math.sin(a)*230;ctx.moveTo(x,y);for(let k=1;k<5;k++)ctx.lineTo(x+Math.cos(a)*k*24+(k%2?14:-14),y+Math.sin(a)*k*24);ctx.stroke();ctx.restore()}
   headline([['IRRITA OS ','#fff'],['NERVOS','#ffe95a']],400,110,lt,.05)},
 (lt,t)=>{brain(300,760,1,t);bigEye(720,1090,.7,t,{squint:true,red:.6});flow(380,820,660,1020,t,'#ffe95a',5,12);label('alerta!',300,960,52,'#ffe95a',prog(lt,.4,.7),900);
   headline([['ALERTA DO ','#fff'],['CÉREBRO','#ff9ec4']],400,110,lt,.05)},
 (lt,t)=>{bigEye(540,860,1.1,t,{tears:true,red:.6*(1-prog(lt,0,2))});headline([['LÁGRIMAS ','#9fd8ff'],['LAVAM','#fff']],400,120,lt,.05)},
 (lt,t)=>{ctx.save();ctx.translate(540,880);ctx.scale(eob(prog(lt,0,.35)),eob(prog(lt,0,.35)));label('💡',0,0,300,'#fff',1,900);ctx.restore();headline([['CHORAR ','#fff'],['MENOS?','#ffe95a']],400,120,lt,.05)},
