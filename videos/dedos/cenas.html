<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="application/json" id="fr">["Por que seus dedos ficam enrugados depois de muito tempo na água?", "Quase todo mundo acha que é porque a pele \"bebe\" água.", "Mas não é bem isso.", "Quem enruga seus dedos é o seu sistema nervoso.", "Ele manda os vasos sanguíneos da ponta dos dedos se contraírem.", "A pele por cima afunda… e formam as rugas.", "A prova? Médicos notaram algo curioso.", "Pessoas com os nervos dos dedos danificados…", "não ficam com os dedos enrugados.", "Mas por que o corpo faria isso de propósito?", "Uma hipótese: para segurar melhor coisas molhadas.", "As rugas funcionam como os sulcos de um pneu…", "que escoam a água e aumentam a aderência.", "Num estudo, pessoas com os dedos enrugados pegaram objetos molhados mais rápido.", "Seu corpo tem um modo chuva embutido."]</script>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="times.js"></script>
<script>
const W=1080,H=1920,F='"Inter Display","Inter",sans-serif';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eoc=x=>1-Math.pow(1-clamp(x),3);
const prog=(lt,a,b)=>clamp((lt-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* ---------- textos ---------- */
function headline(parts,y,size,lt,at=.08){
  const p=prog(lt,at,at+.35);if(p<=0)return;
  ctx.save();ctx.globalAlpha*=clamp(p*3);
  ctx.translate(540,y);const sc=.6+.4*eob(p);ctx.scale(sc,sc);
  ctx.font=`900 ${size}px ${F}`;ctx.textBaseline='middle';
  const ws=parts.map(([tx])=>ctx.measureText(tx).width);
  const tot=ws.reduce((a,b)=>a+b,0);if(tot>940){const f=940/tot;ctx.scale(f,f)}
  let x=-tot/2;
  parts.forEach(([tx,col],i)=>{
    ctx.lineJoin='round';ctx.lineWidth=size*.16;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(tx,x,0);
    ctx.fillStyle=col;ctx.shadowColor=col==='#fff'?'rgba(0,0,0,0)':col;ctx.shadowBlur=col==='#fff'?0:30;ctx.fillText(tx,x,0);ctx.shadowBlur=0;
    x+=ws[i];
  });
  ctx.restore();
}
function label(tx,x,y,size,col='#fff',alpha=1,weight=800){
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px ${F}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=size*.18;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(tx,x,y);
  ctx.fillStyle=col;ctx.fillText(tx,x,y);ctx.restore();
}
function subtitle(text,hl,lt){
  const p=prog(lt,0,.15);
  ctx.save();ctx.font=`900 64px ${F}`;ctx.textBaseline='middle';
  const words=text.split(' '),lines=[[]];let w=0;
  const sp=ctx.measureText(' ').width;
  for(const wd of words){const ww=ctx.measureText(wd).width;
    if(w+ww>900&&lines[lines.length-1].length){lines.push([]);w=0}
    lines[lines.length-1].push(wd);w+=ww+sp}
  const lh=84, y0=1630-(lines.length-1)*lh;
  ctx.translate(540,y0);ctx.scale(.9+.1*eoc(p),.9+.1*eoc(p));ctx.globalAlpha*=clamp(p*2);
  lines.forEach((ln,li)=>{
    const tw=ln.reduce((a,wd)=>a+ctx.measureText(wd).width,0)+sp*(ln.length-1);
    let x=-tw/2;
    for(const wd of ln){
      const key=wd.toLowerCase().replace(/[^a-záàâãéêíóôõúç0-9]/g,'');
      ctx.lineJoin='round';ctx.lineWidth=14;ctx.strokeStyle='#000';ctx.strokeText(wd,x,li*lh);
      ctx.fillStyle=hl.includes(key)?'#ffd23f':'#fff';ctx.fillText(wd,x,li*lh);
      x+=ctx.measureText(wd).width+sp;
    }
  });
  ctx.restore();
}
function watermark(){ctx.save();ctx.globalAlpha=.6;ctx.font=`800 34px ${F}`;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('@factuva',540,150);ctx.restore()}
function flow(x1,y1,x2,y2,t,col,n=6,r=9){
  ctx.save();ctx.strokeStyle=col;ctx.globalAlpha*=.35;ctx.setLineDash([10,14]);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
  for(let i=0;i<n;i++){const q=((t*.8+i/n)%1);ctx.save();ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(lerp(x1,x2,q),lerp(y1,y2,q),r,0,7);ctx.fill();ctx.restore()}
}



/* ---------- fundo ---------- */
function background(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e3a4a');g.addColorStop(.55,'#082733');g.addColorStop(1,'#03121a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const l=ctx.createRadialGradient(540,880,60,540,880,900);l.addColorStop(0,'rgba(120,230,230,.15)');l.addColorStop(1,'rgba(120,230,230,0)');ctx.fillStyle=l;ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){const x=rnd(i+3)*W,y=((rnd(i+5)*H-t*(.2+rnd(i)*.6)*25)%H+H)%H;ctx.strokeStyle=`rgba(200,245,255,${.08+rnd(i+7)*.2})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,3+rnd(i+9)*8,0,7);ctx.stroke()}
}
/* ---------- objetos ---------- */
const SKIN='#8fa2ff',SKD='#6f80e0',BLUE='#5ec8ff',RED='#ff5a6e';
function hand(x,y,s,wr,t,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(o.rot||0);
  ctx.fillStyle=SKIN;
  const F=[[-150,-330,72,300],[-60,-400,76,370],[35,-380,76,350],[125,-320,70,290]];
  F.forEach(([fx,fy,w,h])=>{ctx.beginPath();ctx.roundRect(fx,fy,w,h,w/2);ctx.fill()});
  ctx.save();ctx.translate(-170,-40);ctx.rotate(-.7);ctx.beginPath();ctx.roundRect(-40,-200,80,230,40);ctx.fill();ctx.restore();
  ctx.beginPath();ctx.roundRect(-175,-120,380,330,90);ctx.fill();
  if(wr>0){ctx.strokeStyle=`rgba(60,70,160,${.75*wr})`;ctx.lineWidth=5;ctx.lineCap='round';
    F.forEach(([fx,fy,w])=>{for(let k=0;k<5;k++){const yy=fy+26+k*20;ctx.beginPath();ctx.moveTo(fx+12,yy);ctx.quadraticCurveTo(fx+w/2,yy+(k%2?10:-10)*wr,fx+w-12,yy);ctx.stroke()}});
    ctx.save();ctx.translate(-170,-40);ctx.rotate(-.7);for(let k=0;k<4;k++){const yy=-180+k*20;ctx.beginPath();ctx.moveTo(-28,yy);ctx.quadraticCurveTo(0,yy+(k%2?10:-10)*wr,28,yy);ctx.stroke()}ctx.restore()}
  ctx.restore();
}
function water(y,t,alpha=.45){ctx.fillStyle=`rgba(80,200,255,${alpha})`;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,y);for(let x=0;x<=W;x+=20)ctx.lineTo(x,y+Math.sin(x*.012+t*2)*12);ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
function brain(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ff9ec4';ctx.beginPath();ctx.ellipse(-60,0,120,100,0,0,7);ctx.ellipse(60,0,120,100,0,0,7);ctx.fill();ctx.strokeStyle='#d0648f';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,-95);ctx.lineTo(0,95);ctx.stroke();for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(-120+i*48,-20+(i%2)*40,30,Math.PI*.2,Math.PI*1.2);ctx.stroke()}ctx.restore()}
function section(t,vas,sink){ // corte da ponta do dedo
  const top=760;ctx.save();
  ctx.fillStyle='#f2c7c0';ctx.beginPath();ctx.moveTo(140,1300);ctx.lineTo(140,top);
  for(let x=140;x<=940;x+=10){const w=Math.sin((x-140)/800*Math.PI*6);ctx.lineTo(x,top+Math.max(0,w)*70*sink)}ctx.lineTo(940,1300);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e9a99f';ctx.fillRect(140,900,800,400);
  for(let i=0;i<3;i++){const cx=270+i*270,cy=1000,r=lerp(55,22,vas);ctx.fillStyle=RED;ctx.shadowColor=RED;ctx.shadowBlur=20;ctx.beginPath();ctx.ellipse(cx,cy,r*1.1,r,0,0,7);ctx.fill();ctx.shadowBlur=0}
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=6;ctx.strokeRect(140,top-80,800,620);ctx.restore();
  label('pele',230,top-40,44,'#fff',1,800);label('vasos sanguíneos',540,1180,44,'#fff',1,800);
}
function nerveLine(x1,y1,x2,y2,t,broken=0){ctx.save();ctx.strokeStyle='#ffe95a';ctx.lineWidth=10;ctx.setLineDash([22,14]);ctx.lineDashOffset=-t*80;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(x1+200,(y1+y2)/2,x2,y2);ctx.stroke();ctx.restore();
  if(broken>0){const mx=lerp(x1,x2,.55)+80,my=(y1+y2)/2;ctx.save();ctx.globalAlpha*=broken;ctx.strokeStyle=RED;ctx.lineWidth=22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(mx-60,my-60);ctx.lineTo(mx+60,my+60);ctx.moveTo(mx+60,my-60);ctx.lineTo(mx-60,my+60);ctx.stroke();ctx.restore()}}
function tire(x,y,r,t,spin=1){ctx.save();ctx.translate(x,y);ctx.rotate(t*spin);ctx.fillStyle='#22252b';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#3a3f48';for(let i=0;i<24;i++){ctx.save();ctx.rotate(i/24*Math.PI*2);ctx.fillRect(-12,-r,24,r*.2);ctx.restore()}
  ctx.fillStyle='#9aa3b2';ctx.beginPath();ctx.arc(0,0,r*.55,0,7);ctx.fill();ctx.fillStyle='#5c6577';for(let i=0;i<5;i++){ctx.save();ctx.rotate(i/5*Math.PI*2);ctx.beginPath();ctx.arc(0,-r*.32,r*.08,0,7);ctx.fill();ctx.restore()}ctx.restore()}
function ball(x,y,r,t){ctx.save();const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#ffe58a');g.addColorStop(1,'#ff9a3a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  for(let i=0;i<5;i++){const a=i*1.3+t;ctx.fillStyle='rgba(160,220,255,.9)';ctx.beginPath();ctx.ellipse(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6,8,12,0,0,7);ctx.fill()}ctx.restore()}

/* ---------- cenas ---------- */
const FR=JSON.parse(document.getElementById('fr').textContent);
const HL=[['dedos','enrugados','água'],['pele','bebe'],['não'],['sistema','nervoso'],['vasos','contraírem'],['afunda','rugas'],['prova','curioso'],['nervos','danificados'],['não','enrugados'],['propósito'],['hipótese','segurar','molhadas'],['rugas','pneu'],['escoam','aderência'],['estudo','enrugados','rápido'],['modo','chuva']];
const D=[
 (lt,t)=>{hand(540,1080,1.15,eoc(prog(lt,.8,3.5)),t);water(1150,t);headline([['DEDOS ','#fff'],['ENRUGADOS?',BLUE]],400,104,lt,.05)},
 (lt,t)=>{hand(540,1080,1.05,.3,t);for(let i=0;i<10;i++){const q=((lt*.8+i/10)%1);ctx.fillStyle=`rgba(94,200,255,${1-q})`;ctx.beginPath();ctx.arc(300+rnd(i)*480,700+q*180,12,0,7);ctx.fill()}
   label('a pele "bebe" água?',540,560,58,'#fff',prog(lt,.5,.8),900);headline([['O QUE ','#fff'],['TODO MUNDO ACHA',BLUE]],400,88,lt,.05)},
 (lt,t)=>{hand(540,1080,1.05,.3,t);const p=eob(prog(lt,.1,.4));ctx.save();ctx.translate(540,860);ctx.rotate(-.2);ctx.scale(p,p);ctx.strokeStyle=RED;ctx.lineWidth=16;ctx.strokeRect(-260,-90,520,180);label('MITO',0,0,150,RED,1,900);ctx.restore();
   headline([['NÃO É ','#fff'],['ISSO',RED]],400,130,lt,.05)},
 (lt,t)=>{brain(300,660,.9);hand(700,1180,.75,eoc(prog(lt,.8,2.6)),t);nerveLine(330,750,620,920,t);label('sinal',520,760,48,'#ffe95a',prog(lt,.4,.7),900);
   headline([['SISTEMA ','#fff'],['NERVOSO','#ffe95a']],400,110,lt,.05)},
 (lt,t)=>{section(t,eoc(prog(lt,.5,2.6)),0);label('⬇ contraem',800,1100,46,RED,prog(lt,1,1.3),900);headline([['VASOS ','#fff'],['CONTRAEM',RED]],400,110,lt,.05)},
 (lt,t)=>{section(t,1,eoc(prog(lt,.3,2.2)));label('rugas!',800,700,56,BLUE,prog(lt,1.4,1.7),900);headline([['FORMAM ','#fff'],['RUGAS',BLUE]],400,120,lt,.05)},
 (lt,t)=>{ctx.save();ctx.translate(540,900);ctx.rotate(Math.sin(t*2)*.08);ctx.scale(eob(prog(lt,0,.4)),eob(prog(lt,0,.4)));ctx.strokeStyle='#ffe95a';ctx.lineWidth=26;ctx.beginPath();ctx.arc(-40,-40,170,0,7);ctx.stroke();ctx.lineCap='round';ctx.beginPath();ctx.moveTo(80,80);ctx.lineTo(220,220);ctx.stroke();ctx.restore();
   label('🩺',540,860,150,'#fff',prog(lt,.3,.6),900);headline([['A ','#fff'],['PROVA','#ffe95a']],400,140,lt,.05)},
 (lt,t)=>{brain(300,660,.9);hand(700,1180,.75,0,t);nerveLine(330,750,620,920,t,eob(prog(lt,.5,.9)));headline([['NERVO ','#fff'],['DANIFICADO',RED]],400,104,lt,.05)},
 (lt,t)=>{hand(300,1100,.7,1,t);hand(780,1100,.7,0,t);water(1140,t);label('normal',300,560,48,'#fff',1,900);label('nervo danificado',780,560,44,'#fff',1,900);label('sem rugas',780,640,48,RED,prog(lt,.4,.7),900);
   headline([['SEM ','#fff'],['RUGAS',RED]],400,130,lt,.05)},
 (lt,t)=>{label('🤔',540,900,320,'#fff',eob(prog(lt,0,.35)),900);headline([['DE ','#fff'],['PROPÓSITO?','#ffe95a']],400,120,lt,.05)},
 (lt,t)=>{for(let i=0;i<30;i++){const q=((t*1.4+rnd(i))%1);ctx.strokeStyle='rgba(140,200,255,.7)';ctx.lineWidth=4;ctx.beginPath();const x=rnd(i+2)*W,y=500+q*900;ctx.moveTo(x,y);ctx.lineTo(x-6,y+28);ctx.stroke()}
   ball(560,820,110,t);hand(540,1150,.9,1,t);headline([['SEGURAR ','#fff'],['MELHOR',BLUE]],400,120,lt,.05)},
 (lt,t)=>{tire(540,920,290,t,.6);headline([['COMO UM ','#fff'],['PNEU','#c3cad6']],400,130,lt,.05)},
 (lt,t)=>{ctx.fillStyle='#2a2f38';ctx.fillRect(0,1150,W,200);ctx.fillStyle='rgba(94,200,255,.5)';ctx.fillRect(0,1150,W,18);tire(540,900,250,t,1.2);
   for(let i=0;i<16;i++){const q=((t*1.5+i/16)%1),side=i%2?1:-1;ctx.fillStyle=`rgba(140,210,255,${1-q})`;ctx.beginPath();ctx.arc(540+side*(150+q*360),1140-Math.sin(q*Math.PI)*170,10,0,7);ctx.fill()}
   headline([['ESCOA A ','#fff'],['ÁGUA',BLUE]],400,130,lt,.05)},
 (lt,t)=>{const p=eoc(prog(lt,.4,2.6));label('🖐️ enrugados',300,760,46,'#fff',1,900);label('🖐️ lisos',300,980,46,'#fff',1,900);
   ctx.fillStyle=BLUE;ctx.shadowColor=BLUE;ctx.shadowBlur=20;ctx.beginPath();ctx.roundRect(160,800,760*p,70,14);ctx.fill();ctx.fillStyle='#8a93a6';ctx.shadowBlur=0;ctx.beginPath();ctx.roundRect(160,1020,760*p*.8,70,14);ctx.fill();
   label('mais rápido! 🏁',540,1220,56,'#ffe95a',prog(lt,2.6,3),900);headline([['UM ','#fff'],['ESTUDO','#ffe95a']],400,130,lt,.05)},
 (lt,t)=>{hand(480,1150,.85,1,t);label('☔',480,640,200,'#fff',eob(prog(lt,0,.35)),900);
   const on=prog(lt,.5,.8);ctx.save();ctx.fillStyle=on>.5?'#3fd17a':'#555';ctx.beginPath();ctx.roundRect(760,880,220,96,48);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lerp(808,932,on),928,38,0,7);ctx.fill();ctx.restore();
   headline([['MODO ','#fff'],['CHUVA',BLUE]],400,130,lt,.05);
   const e=prog(lt,2.4,2.7);if(e>0){ctx.save();ctx.globalAlpha*=e;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.roundRect(290,1260,500,96,48);ctx.fill();ctx.restore();label('➕ Segue @factuva',540,1309,44,'#111',e,900)}},
];
window.TOTAL=window.TIMES[window.TIMES.length-1][1];
window.renderFrame=function(t){
  let i=TIMES.findIndex(([a,b])=>t>=a&&t<b);if(i<0)i=D.length-1;
  const [a,b]=TIMES[i],lt=t-a;
  background(t);ctx.save();ctx.globalAlpha=clamp(lt/.15);D[i](lt,t,b-a);ctx.restore();
  {const g=ctx.createLinearGradient(0,1380,0,1800);g.addColorStop(0,'rgba(2,8,20,0)');g.addColorStop(.35,'rgba(2,8,20,.6)');g.addColorStop(1,'rgba(2,8,20,.75)');ctx.fillStyle=g;ctx.fillRect(0,1380,W,540);}
  ctx.textAlign='left';subtitle(FR[i],HL[i],lt);watermark();
};
window.ready=Promise.all(['900','800','700'].map(w=>document.fonts.load(`${w} 64px "Inter Display"`)));
</script></body></html>
