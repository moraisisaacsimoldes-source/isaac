  *{margin:0;padding:0;box-sizing:border-box}

  h1 .hl{color:#ffb81c;text-shadow:0 7px 0 #9a5a00,0 0 60px rgba(255,170,20,.55)}
  .sub{margin-top:46px;font-size:52px;font-weight:600;line-height:1.25;color:#fff1d6}
  .sub b{color:#ffcf5a}
  .chips{margin-top:64px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:960px}
  .chip{font-size:34px;font-weight:700;padding:14px 28px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,184,28,.6)}
  .handle{position:absolute;left:0;right:0;bottom:330px;text-align:center;font-size:44px;font-weight:800;letter-spacing:2px;opacity:.9}
